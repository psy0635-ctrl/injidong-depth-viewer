name: Python validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-viewer.txt
            apps/local_review/requirements.txt
      - run: python -m pip install -r apps/local_review/requirements.txt
      - run: python -B -X utf8 scripts/run_checks.py
